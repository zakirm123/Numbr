<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Numbr - Math with Archie</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="game-container">
        <!-- Mascot Header -->
        <div class="mascot-container">
            <div class="archie-avatar">🦅</div>
            <div class="bubble" id="archie-bubble">Hi! I'm Archie! Which grade are you in?</div>
        </div>

                <!-- Gameplay Screen -->
        <div id="game-screen" class="screen hidden">
            <div class="game-stats">
                <div class="score-board">Score: <span id="score">0</span></div>
                <div id="timer-container" class="timer-board hidden">Time: <span id="timer">30</span>s</div>
            </div>
            <div id="question" class="question-text">Question goes here</div>
            <input type="number" id="answer-input" placeholder="Your answer...">
            <button class="btn btn-submit" onclick="checkAnswer()">Submit</button>
            <button class="btn btn-back" onclick="resetGame()">Change Grade</button>
        </div>

    <script src="script.js"></script>
</body>
</html>
